server {
    listen 80;
    listen [::]:80;
    server_name aiworldline.aprilworks.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aiworldline.aprilworks.cn;

    ssl_certificate /etc/letsencrypt/live/aiworldline.aprilworks.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aiworldline.aprilworks.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AIWorldlineSSL:10m;
    ssl_session_timeout 1d;

    root /var/www/aiworldline.aprilworks.cn/current;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}

